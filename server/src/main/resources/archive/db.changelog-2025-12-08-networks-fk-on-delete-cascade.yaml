databaseChangeLog:
  # FK: networks.chat_id -> chats.chat_id
  - changeSet:
      id: 2025-12-08-networks-fk-chat-on-delete-cascade
      author: floki
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          - foreignKeyConstraintExists:
              baseTableName: networks
              foreignKeyName: fk_networks_chat
      changes:
        - addForeignKeyConstraint:
            baseTableName: networks
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: chat_id
            constraintName: fk_networks_chat
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: networks
            constraintName: fk_networks_chat

  # FK: networks.ref_id -> chats.chat_id
  - changeSet:
      id: 2025-12-08-networks-fk-ref-on-delete-cascade
      author: floki
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          - foreignKeyConstraintExists:
              baseTableName: networks
              foreignKeyName: fk_networks_ref
      changes:
        - addForeignKeyConstraint:
            baseTableName: networks
            baseColumnNames: ref_id
            referencedTableName: chats
            referencedColumnNames: chat_id
            constraintName: fk_networks_ref
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: networks
            constraintName: fk_networks_ref
