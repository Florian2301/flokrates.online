databaseChangeLog:
  - changeSet:
      id: 0001-init-tables
      author: Flokrates
      changes:
        - createTable:
            tableName: about
            remarks: Stores localized text entries
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  remarks: Primary Key
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: section_key
                  type: VARCHAR(50)
                  remarks: Logical section identifier (e.g. project, author, flokrates)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: VARCHAR(2)
                  remarks: German (DE) or English (EN)
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: timestamp
                  remarks: Date text has been created
                  defaultValueComputed: current_timestamp() on update current_timestamp()
                  constraints:
                    nullable: false
              - column:
                  name: date_modified
                  type: timestamp
                  remarks: Date text has been changed (nullable)
                  defaultValueComputed: 'NULL'

        - createTable:
            tableName: chats
            columns:
              - column:
                  name: chat_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_number
                  type: INT
                  defaultValueComputed: 'NULL'
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: tags
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: language
                  type: ENUM('DE', 'EN')
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: ENUM('DRA', 'NOT', 'PUB', 'REW')
                  constraints:
                    nullable: false
              - column:
                  name: date_published
                  type: datetime
                  defaultValueComputed: 'NULL'
              - column:
                  name: date_created
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: date_modified
                  type: datetime
                  defaultValueComputed: 'NULL'

        - createTable:
            tableName: comments
            columns:
              - column:
                  name: comment_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: sender
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
              - column:
                  name: comment_text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: date_modified
                  type: datetime
                  defaultValueComputed: 'NULL'
              - column:
                  name: is_admin
                  type: BIT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createTable:
            tableName: messages
            columns:
              - column:
                  name: message_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: chat_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: resp_id
                  type: INT
                  defaultValueComputed: 'NULL'
              - column:
                  name: actor
                  type: ENUM('FLO', 'LOT', 'PAB')
                  constraints:
                    nullable: false
              - column:
                  name: message_text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: date_modified
                  type: datetime
                  defaultValueComputed: 'NULL'

        - createTable:
            tableName: message_attachments
            remarks: Anhänge/Links pro Chat-Nachricht
            columns:
              - column:
                  name: attachment_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: kind
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(512)
              - column:
                  name: href
                  type: VARCHAR(1024)
              - column:
                  name: content_type
                  type: VARCHAR(255)
              - column:
                  name: file_name
                  type: VARCHAR(255)
              - column:
                  name: file_size_bytes
                  type: BIGINT
                  defaultValueComputed: 'NULL'
              - column:
                  name: width_px
                  type: INT
                  defaultValueComputed: 'NULL'
              - column:
                  name: height_px
                  type: INT
                  defaultValueComputed: 'NULL'
              - column:
                  name: duration_ms
                  type: INT
                  defaultValueComputed: 'NULL'
              - column:
                  name: page_count
                  type: INT
                  defaultValueComputed: 'NULL'
              - column:
                  name: preview_href
                  type: VARCHAR(1024)
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: datetime
                  defaultValueComputed: current_timestamp()
                  constraints:
                    nullable: false
              - column:
                  name: checksum_sha256
                  type: BINARY(32)
                  remarks: Optionaler SHA-256 Prüfsummen-Hash zum Deduplizieren
                  defaultValueComputed: 'NULL'
              - column:
                  name: date_modified
                  type: datetime
                  remarks: Appseitig via @PreUpdate befüllt
                  defaultValueComputed: 'NULL'

        - createTable:
            tableName: networks
            columns:
              - column:
                  name: net_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: ref_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: date_modified
                  type: datetime
                  defaultValueComputed: 'NULL'

        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: token_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INT
                  defaultValueComputed: 'NULL'
              - column:
                  name: token_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: issued_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: revoked
                  type: BIT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: device
                  type: VARCHAR(100)

        - createTable:
            tableName: roles
            columns:
              - column:
                  name: role_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: user
            columns:
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_modified
                  type: datetime
                  defaultValueComputed: 'NULL'
              - column:
                  name: enabled
                  type: BIT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: INT
                  constraints:
                    nullable: false

  - changeSet:
      id: 0002-init-constraints-indexes
      author: Flokrates
      changes:
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles

        - addUniqueConstraint:
            tableName: networks
            columnNames: chat_id, ref_id
            constraintName: uq_network_chat_ref

        - createIndex:
            tableName: user_roles
            indexName: fk_ar_role
            columns:
              - column:
                  name: role_id

        - createIndex:
            tableName: comments
            indexName: fk_comments_chat
            columns:
              - column:
                  name: chat_id

        - createIndex:
            tableName: messages
            indexName: fk_messages_chat
            columns:
              - column:
                  name: chat_id

        - createIndex:
            tableName: messages
            indexName: fk_messages_resp
            columns:
              - column:
                  name: resp_id

        - createIndex:
            tableName: message_attachments
            indexName: idx_msgatt_checksum
            columns:
              - column:
                  name: checksum_sha256

        - createIndex:
            tableName: message_attachments
            indexName: idx_msgatt_content_type
            columns:
              - column:
                  name: content_type

        - createIndex:
            tableName: message_attachments
            indexName: idx_msgatt_kind
            columns:
              - column:
                  name: kind

        - createIndex:
            tableName: message_attachments
            indexName: idx_msgatt_message
            columns:
              - column:
                  name: message_id
              - column:
                  name: sort_order

        - createIndex:
            tableName: message_attachments
            indexName: idx_msgatt_storage_key
            columns:
              - column:
                  name: storage_key

        - createIndex:
            tableName: networks
            indexName: idx_network_chat_id
            columns:
              - column:
                  name: chat_id

        - createIndex:
            tableName: networks
            indexName: idx_network_ref_id
            columns:
              - column:
                  name: ref_id

        - createIndex:
            tableName: refresh_tokens
            indexName: ix_rt_author_id
            columns:
              - column:
                  name: user_id

        # MySQL/MariaDB: Prefix-Index auf href
        - sql:
            dbms: mariadb,mysql
            preConditions:
              onFail: MARK_RAN
              onError: MARK_RAN
              not:
                indexExists:
                  tableName: message_attachments
                  indexName: idx_msgatt_href
            sql: CREATE INDEX idx_msgatt_href ON message_attachments (href(512));

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: user
            referencedColumnNames: user_id
            constraintName: fk_ar_author
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: role_id
            constraintName: fk_ar_role
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: chat_id
            constraintName: fk_comments_chat
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: chat_id
            constraintName: fk_messages_chat
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: resp_id
            referencedTableName: messages
            referencedColumnNames: message_id
            constraintName: fk_messages_resp
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: message_attachments
            baseColumnNames: message_id
            referencedTableName: messages
            referencedColumnNames: message_id
            constraintName: fk_msgatt_message
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: networks
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: chat_id
            constraintName: fk_networks_chat
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: networks
            baseColumnNames: ref_id
            referencedTableName: chats
            referencedColumnNames: chat_id
            constraintName: fk_networks_ref
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            referencedTableName: user
            referencedColumnNames: user_id
            constraintName: fk_rt_author
            onDelete: CASCADE
            onUpdate: RESTRICT
