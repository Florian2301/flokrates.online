databaseChangeLog:
  # --- messages.chat_id -> chats.chat_id (CASCADE) ---
  - changeSet:
      id: fk-messages-chat-drop-if-exists
      author: floki
      preConditions:
        onFail: MARK_RAN
        foreignKeyConstraintExists:
          foreignKeyName: fk_messages_chat
      changes:
        - dropForeignKeyConstraint:
            baseTableName: messages
            constraintName: fk_messages_chat
      rollback:
        - sql: "/* no-op rollback for drop of old fk_messages_chat */"

  - changeSet:
      id: fk-messages-chat-add-cascade
      author: floki
      preConditions:
        onFail: CONTINUE
        not:
          foreignKeyConstraintExists:
            foreignKeyName: fk_messages_chat
      changes:
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: chat_id
            onDelete: CASCADE
            constraintName: fk_messages_chat
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: messages
            constraintName: fk_messages_chat

