databaseChangeLog:
  # 1) Alten MySQL-FK (comments_ibfk_1) droppen, falls vorhanden
  - changeSet:
      id: 2025-12-08-comments-drop-mysql-fk
      author: floki
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        nestedPreconditions:
          - foreignKeyConstraintExists:
              baseTableName: comments
              foreignKeyName: comments_ibfk_1
      changes:
        - dropForeignKeyConstraint:
            baseTableName: comments
            constraintName: comments_ibfk_1

  # 2) Evtl. alten fk_comments_chat droppen, falls vorhanden
  - changeSet:
      id: 2025-12-08-comments-drop-old-fk-comments-chat
      author: floki
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        nestedPreconditions:
          - foreignKeyConstraintExists:
              baseTableName: comments
              foreignKeyName: fk_comments_chat
      changes:
        - dropForeignKeyConstraint:
            baseTableName: comments
            constraintName: fk_comments_chat

  # 3) Neuer FK mit ON DELETE CASCADE
  - changeSet:
      id: 2025-12-08-comments-fk-on-delete-cascade
      author: floki
      changes:
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: chat_id
            constraintName: fk_comments_chat
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: comments
            constraintName: fk_comments_chat
